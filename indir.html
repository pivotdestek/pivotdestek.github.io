<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dirayz'ı indir</title>
<meta name="description" content="Dirayz'ı App Store ya da Google Play'den indir.">
<meta name="theme-color" content="#0B1C34">
<link rel="canonical" href="https://dirayz.com/indir">
<meta property="og:type" content="website">
<meta property="og:title" content="Dirayz'ı indir">
<meta property="og:description" content="Dirayz'ı App Store ya da Google Play'den indir.">
<meta property="og:url" content="https://dirayz.com/indir">
<meta property="og:locale" content="tr_TR">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 36 36'%3E%3Crect width='36' height='36' rx='9' fill='%230B1C34'/%3E%3Crect x='8' y='20' width='5' height='8' rx='1.5' fill='%23F8A01D'/%3E%3Crect x='15.5' y='14' width='5' height='14' rx='1.5' fill='%23F8A01D'/%3E%3Crect x='23' y='8' width='5' height='20' rx='1.5' fill='%23F8A01D'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Yazı tipi sayfayı ve mağazaya geçişi bekletmesin: önce "print", yüklenince "all". -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;700;800&display=swap" media="print" onload="this.media='all'">
<style>
  :root {
    --lacivert: #0B1C34;
    --lacivert-acik: #16335A;
    --amber: #F8A01D;
    --acik-metin: #B8C3D6;
    --font: "Outfit", "Segoe UI", system-ui, -apple-system, sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { background: var(--lacivert); }
  body {
    font-family: var(--font);
    background: var(--lacivert);
    color: #fff;
    line-height: 1.5;
    -webkit-text-size-adjust: 100%;
    min-height: 100vh;
    min-height: 100svh;
    display: flex; align-items: center; justify-content: center;
    padding: 40px 16px;
  }
  :focus-visible { outline: 3px solid var(--amber); outline-offset: 3px; border-radius: 4px; }
  main { width: 100%; max-width: 420px; text-align: center; }
  .marka {
    display: inline-flex; align-items: center; gap: 10px;
    font-weight: 800; font-size: 22px; letter-spacing: 0.14em; color: #fff; text-decoration: none;
  }
  .marka svg { width: 32px; height: 32px; }
  h1 { margin-top: 32px; font-size: clamp(30px, 9vw, 40px); line-height: 1.1; font-weight: 800; letter-spacing: -0.02em; }
  .cizgi-amber { width: 72px; height: 8px; border-radius: 4px; background: var(--amber); margin: 20px auto 22px; }
  .durum { font-size: 18px; color: var(--acik-metin); }
  .magaza-grup { display: flex; flex-direction: column; align-items: center; gap: 12px; margin-top: 28px; }
  .magaza {
    display: flex; align-items: center; justify-content: center; gap: 12px;
    width: 100%; max-width: 300px; min-height: 60px; padding: 10px 18px 10px 14px; border-radius: 14px;
    background: #fff; color: var(--lacivert); text-decoration: none;
    transition: transform 0.15s, background 0.15s;
  }
  .magaza:hover { background: #F2F5FA; transform: translateY(-1px); }
  .magaza svg { width: 28px; height: 28px; flex-shrink: 0; }
  .magaza span { display: block; line-height: 1.15; text-align: left; }
  .magaza .m1 { font-size: 12px; font-weight: 500; opacity: 0.8; }
  .magaza .m2 { font-size: 18px; font-weight: 700; }
  .ipucu { margin-top: 24px; padding: 14px 16px; border-radius: 14px; background: var(--lacivert-acik); font-size: 15px; color: var(--acik-metin); }
  .geri { display: inline-block; margin-top: 32px; font-size: 15px; font-weight: 500; color: var(--acik-metin); }
  .geri:hover { color: #fff; }
  @media (prefers-reduced-motion: reduce) { .magaza { transition: none; } }
</style>
</head>
<body>
<main>
  <a class="marka" href="/" aria-label="Dirayz ana sayfa"><svg viewBox="0 0 36 36" aria-hidden="true"><rect width="36" height="36" rx="9" fill="#F8A01D"></rect><rect x="8" y="20" width="5" height="8" rx="1.5" fill="#0B1C34"></rect><rect x="15.5" y="14" width="5" height="14" rx="1.5" fill="#0B1C34"></rect><rect x="23" y="8" width="5" height="20" rx="1.5" fill="#0B1C34"></rect></svg>DIRAYZ</a>
  <h1>Dirayz'ı indir</h1>
  <div class="cizgi-amber"></div>
  <p class="durum" id="durum">Telefonuna uygun mağazayı seç.</p>
  <div class="magaza-grup">
    <a class="magaza" id="apple" href="https://apps.apple.com/tr/app/dirayz-yks-lgs-kpss-disiplin/id6815436081">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="2.5" width="12" height="19" rx="3"></rect><path d="M10 18.5h4"></path></svg>
      <span><span class="m1">iPhone için</span><span class="m2">App Store</span></span>
    </a>
    <a class="magaza" id="play" href="https://play.google.com/store/apps/details?id=com.derecelab.app">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"></path><path d="M7 10l5 5 5-5"></path><path d="M4 19h16"></path></svg>
      <span><span class="m1">Android için</span><span class="m2">Google Play</span></span>
    </a>
  </div>
  <p class="ipucu" id="ipucu" hidden>Açılmıyorsa sağ üstteki menüden (⋮ ya da ⋯) bu sayfayı tarayıcıda aç.</p>
  <a class="geri" href="/">Ana sayfaya dön</a>
</main>
<script>
  (function () {
    // ── Mağaza adresleri ──────────────────────────────────────────────
    var APPLE = "https://apps.apple.com/tr/app/dirayz-yks-lgs-kpss-disiplin/id6815436081";
    // Düğme: Play Store uygulamasını doğrudan açar (Instagram, TikTok, Facebook gibi uygulama içi
    // tarayıcılarda Play'in web sayfası açılıp girişe takılmasın diye). Play Store yoksa tarayıcı
    // web sayfasına döner. Ana sayfadaki Google Play bağlantıları Android'de aynı adresi kullanır.
    var PLAY_INTENT = "intent://details?id=com.derecelab.app#Intent;scheme=market;package=com.android.vending;S.browser_fallback_url=https%3A%2F%2Fplay.google.com%2Fstore%2Fapps%2Fdetails%3Fid%3Dcom.derecelab.app;end";
    // Sayfa açılınca kendiliğinden deneme: aynı istek, web sayfasına dönüşü yok. Tarayıcı dokunmadan
    // uygulama açmaya izin vermezse kullanıcı Play'in web sayfasına (giriş ekranına) gitmez; bu sayfa
    // ve düğme yerinde kalır, dokununca açılır.
    var PLAY_INTENT_KENDILIGINDEN = "intent://details?id=com.derecelab.app#Intent;scheme=market;package=com.android.vending;end";

    var ua = navigator.userAgent || "";
    var android = /Android/i.test(ua);
    // iPadOS 13 ve sonrası Safari kendini Mac gibi tanıtır; dokunmatik ekranından ayrılır.
    var ios = !android && (/iPhone|iPad|iPod/i.test(ua) || (/Macintosh/i.test(ua) && navigator.maxTouchPoints > 1));
    // Uygulama içi tarayıcı: Instagram, Facebook / Messenger, TikTok; Android'de adsız gömülü
    // tarayıcı ("; wv)"), iPhone'da Safari olmayan gömülü tarayıcı.
    var uygulamaIci = /Instagram|FBAN|FBAV|FB_IAB|FB4A|FBIOS|musical_ly|Bytedance|TikTok/i.test(ua) ||
      (android && /; wv\)/.test(ua)) ||
      (ios && !/Safari\//.test(ua));

    var durum = document.getElementById("durum");
    var apple = document.getElementById("apple");
    var play = document.getElementById("play");
    var ipucu = document.getElementById("ipucu");

    function geriGelindiMi() {
      try {
        var g = window.performance && performance.getEntriesByType && performance.getEntriesByType("navigation")[0];
        if (g && g.type) return g.type === "back_forward";
        if (window.performance && performance.navigation) return performance.navigation.type === 2;
      } catch (e) { /* bilinmiyor */ }
      return false;
    }

    function yonlendir(adres) {
      // Geri / ileri tuşuyla dönüldüyse yeniden yönlendirmez (döngü olmasın); düğme yerinde kalır.
      if (!geriGelindiMi()) window.location.href = adres;
    }

    if (android) {
      apple.hidden = true;
      play.href = PLAY_INTENT;
      durum.textContent = "Google Play açılıyor. Açılmazsa düğmeye dokun.";
      ipucu.hidden = !uygulamaIci;
      yonlendir(PLAY_INTENT_KENDILIGINDEN);
    } else if (ios) {
      play.hidden = true;
      durum.textContent = "App Store açılıyor. Açılmazsa düğmeye dokun.";
      ipucu.hidden = !uygulamaIci;
      yonlendir(APPLE);
    }
  })();
</script>
</body>
</html>
